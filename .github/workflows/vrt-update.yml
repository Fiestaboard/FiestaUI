name: VRT Update Baselines

# Manually triggered: regenerates vrt/baselines/ on a Linux runner (the
# canonical rendering environment — see docs/VISUAL_REGRESSION.md) and
# commits the result back to the branch the workflow was dispatched on.
# Run this after intentional visual changes, or to seed baselines.
#
# Dispatched on `main`, the commit below lands on the default branch, which
# `main-protection` covers. The Claude bot app is that ruleset's sole bypass
# actor — GITHUB_TOKEN is the GitHub Actions app and is NOT — so a push with
# the default checkout credentials bounces off the ruleset every time. Mint
# the app token and check out with it, exactly like release.yml does.
#
# Shape: plan -> shoot (matrix) -> adopt. Re-shooting every story at two
# viewports x two themes is ~8 minutes of screenshots in one job; split across
# N runners it is under a minute each, and the ~65s of per-runner setup is
# cheap enough that the split pays for itself several times over.
#
# The `adopt` step is what makes the split safe. Baselines are regenerated
# WHOLESALE, so a shard whose artifact never arrived would otherwise commit a
# tree with holes — and a hole reads to the next `compare` as "new story, no
# baseline", indistinguishable from a story someone just added. `adopt` refuses
# to write anything unless every shard's manifest accounts for every shot.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vrt-update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan shards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      shards: ${{ steps.plan.outputs.vrt_shards }}
      shard_count: ${{ steps.plan.outputs.vrt_shard_count }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      # Sizes the fan-out from the CURRENT baseline tree, which is also what
      # ci.yml shards on — one rule, one script, no drift.
      #
      # Seeding a repo with no baselines yet is the one case this cannot size:
      # the count is zero, so the planner returns a single shard and the seed
      # runs unsharded. That is correct rather than unfortunate — there is no
      # workload estimate to shard by — and it self-corrects on the next run,
      # once there is a tree to measure.
      - name: Plan
        id: plan
        run: node scripts/ci/plan-shards.mjs >> "$GITHUB_OUTPUT"

  shoot:
    name: Shoot (${{ matrix.shard }}/${{ needs.plan.outputs.shard_count }})
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Unlike the `compare` matrix in ci.yml, this one DOES fail fast: `adopt`
      # will refuse the merge without every shard's output, so letting the rest
      # of the fan-out finish after one shard dies only burns runners.
      fail-fast: true
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-a11y-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build Storybook
        run: npm run build-storybook -- --quiet

      - name: Start Storybook static server
        run: |
          npx http-server storybook-static --port 6006 --silent &
          sleep 5

      # Writes this shard's slice plus manifest-<i>-of-<N>.json, which records
      # both what the whole run should produce and what this shard produced.
      # `adopt` reassembles from those manifests.
      - name: Shoot baselines
        timeout-minutes: 10
        env:
          SHARD: ${{ matrix.shard }}
          SHARD_TOTAL: ${{ needs.plan.outputs.shard_count }}
        run: node scripts/vrt/vrt.mjs shoot --out "${RUNNER_TEMP}/shots" --shard "${SHARD}/${SHARD_TOTAL}"

      - name: Upload shard
        uses: actions/upload-artifact@v5
        with:
          name: vrt-shot-${{ matrix.shard }}
          path: ${{ runner.temp }}/shots/
          if-no-files-found: error
          retention-days: 1

  adopt:
    name: Adopt and commit baselines
    needs: [plan, shoot]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Mint app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.CLAUDE_BOT_APP_ID }}
          private-key: ${{ secrets.CLAUDE_BOT_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      # `adopt` never opens a browser, but it lives in vrt.mjs — which imports
      # playwright at module scope — so the package still has to resolve. This
      # is the npm install only, not `playwright install`: no browser download.
      - name: Install dependencies
        run: npm ci --no-audit

      # `merge-multiple` overlays every shard's <viewport>/<theme>/ tree into
      # one directory. Overlaying is safe because shards write disjoint files
      # by construction — and `adopt` proves that rather than assuming it.
      - name: Download shards
        uses: actions/download-artifact@v5
        with:
          pattern: vrt-shot-*
          merge-multiple: true
          path: ${{ runner.temp }}/shots

      - name: Adopt baselines
        run: node scripts/vrt/vrt.mjs adopt --from "${RUNNER_TEMP}/shots"

      - name: Commit and push baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A vrt/baselines
          if git diff --cached --quiet; then
            echo "Baselines unchanged — nothing to commit"
            exit 0
          fi

          # This re-shoots EVERY story, so the stage below holds every baseline
          # that moved — not just the ones that failed. Stories whose drift sat
          # under the per-story pixel budget get silently re-accepted too, and
          # that is how a budget quietly stops being a ratchet: the v1.6.0
          # rebaseline rewrote 19 stories when CI had flagged only 11. Naming
          # the changed files in the commit body and the job summary is what
          # makes an unflagged rebaseline reviewable after the fact.
          changed=()
          while IFS= read -r f; do changed+=("$f"); done \
            < <(git diff --cached --name-only -- vrt/baselines)
          {
            echo "chore(vrt): update visual baselines"
            echo
            echo "Regenerated on the Linux runner by the VRT Update Baselines"
            echo "workflow across ${SHARD_COUNT} shard(s). ${#changed[@]} baseline image(s) changed:"
            echo
            printf '%s\n' "${changed[@]#vrt/baselines/}" | sed 's/^/- /'
          } > "${RUNNER_TEMP}/vrt-commit-msg.txt"

          {
            echo "### Baselines updated (${#changed[@]})"
            printf '%s\n' "${changed[@]#vrt/baselines/}" | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"

          git commit -F "${RUNNER_TEMP}/vrt-commit-msg.txt"
          git push origin "HEAD:${GITHUB_REF_NAME}"
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          SHARD_COUNT: ${{ needs.plan.outputs.shard_count }}
