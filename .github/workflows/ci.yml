name: CI

on:
  push:
    branches: [main]
  pull_request:
  # seed_baselines exists because vrt-update.yml can't be dispatched until it
  # lands on the default branch — dispatching CI with this input runs the same
  # baseline seeding from this ref. Remove once vrt-update.yml is on main.
  workflow_dispatch:
    inputs:
      seed_baselines:
        description: "Regenerate vrt/baselines and commit to this branch"
        type: boolean
        default: false

jobs:
  vrt-seed:
    name: Seed VRT baselines
    if: github.event_name == 'workflow_dispatch' && inputs.seed_baselines
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-a11y-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build Storybook
        run: npm run build-storybook -- --quiet

      - name: Start Storybook static server
        run: |
          npx http-server storybook-static --port 6006 --silent &
          sleep 5

      - name: Regenerate baselines
        timeout-minutes: 12
        run: npm run vrt:update

      - name: Commit and push baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A vrt/baselines
          if git diff --cached --quiet; then
            echo "Baselines unchanged — nothing to commit"
            exit 0
          fi
          git commit -m "chore(vrt): update visual baselines"
          git push origin "HEAD:${GITHUB_REF_NAME}"
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}

  lint:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

  build:
    name: Build package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Build
        run: npm run build

      - name: Verify dist contents
        run: |
          test -f dist/index.js
          test -f dist/index.d.ts
          test -f dist/theme.css
          npm pack --dry-run

  perf-bundle:
    name: Bundle Budget
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Needs a base to compare against, so PRs only.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      # Installed ONCE, at head, and never reinstalled. Reinstalling at base
      # would uninstall esbuild on any PR that touches package-lock.json —
      # including the PR that first added it. Holding dependencies fixed also
      # isolates the source change, which is the only thing being gated.
      - name: Install dependencies
        run: npm ci --no-audit

      # The harness must not come from the checked-out tree: it does not exist
      # at the base commit of the PR that adds it, and in general the two
      # copies could differ. Measuring both sides with identical code is the
      # whole point.
      - name: Stage the harness outside the worktree
        run: cp -R scripts/perf "$RUNNER_TEMP/perf-tool"

      # Only the build inputs are swapped, not the whole tree — node_modules,
      # scripts/ and the git ref all stay put, which is why the head step can
      # restore from HEAD without any ref juggling.
      - name: Measure base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git checkout --quiet --force "$BASE_SHA" -- \
            src package.json vite.config.ts tsconfig.build.json
          npm run build
          node "$RUNNER_TEMP/perf-tool/bundle.mjs" measure \
            --out "$RUNNER_TEMP/base.json" --dist "$GITHUB_WORKSPACE/dist"

      - name: Measure head
        run: |
          set -euo pipefail
          git checkout --quiet --force HEAD -- \
            src package.json vite.config.ts tsconfig.build.json
          npm run build
          node "$RUNNER_TEMP/perf-tool/bundle.mjs" measure \
            --out "$RUNNER_TEMP/head.json" --dist "$GITHUB_WORKSPACE/dist"

      - name: Compare
        id: compare
        run: |
          set +e
          node "$RUNNER_TEMP/perf-tool/bundle.mjs" compare \
            --base "$RUNNER_TEMP/base.json" \
            --head "$RUNNER_TEMP/head.json" \
            --markdown "$RUNNER_TEMP/report.md"
          code=$?
          set -e
          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"

      # Report-only during rollout. Promoting this to a hard failure (with the
      # perf-budget-ok escape hatch) is a follow-up, once the numbers have
      # proven stable on real PRs — see the plan's Task 5.
      - name: Report result
        env:
          COMPARE_EXIT: ${{ steps.compare.outputs.exit_code }}
        run: |
          if [ "$COMPARE_EXIT" != "0" ]; then
            echo "::warning::Bundle budget regression detected (report-only during rollout)."
          else
            echo "No bundle regressions."
          fi

  automation:
    name: Automation scripts & workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Shellcheck upgrade scripts
        run: shellcheck scripts/downstream-upgrade/*.sh scripts/downstream-upgrade/tests/*.sh

      - name: Run script tests
        run: bash scripts/downstream-upgrade/tests/run.sh

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      # No `npm ci` needed: compare.mjs is dependency-free and node --test is
      # built in. Keeps this job as fast as it is today.
      - name: Run perf harness unit tests
        run: npm run perf:test

      - name: actionlint
        run: |
          bash <(curl -sSf https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

  a11y-tests:
    name: Accessibility Tests (${{ matrix.theme }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        theme: [dark, light]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-a11y-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build Storybook
        run: npm run build-storybook -- --quiet

      - name: Start Storybook static server
        run: |
          npx http-server storybook-static --port 6006 --silent &
          sleep 5

      - name: Run Storybook a11y tests
        timeout-minutes: 8
        run: |
          URL="http://localhost:6006"
          if [ "${{ matrix.theme }}" = "light" ]; then
            URL="${URL}?globals=theme:light"
          fi
          npm run test-storybook:ci -- --url "$URL"

  visual-regression:
    name: Visual Regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-a11y-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build Storybook
        run: npm run build-storybook -- --quiet

      - name: Start Storybook static server
        run: |
          npx http-server storybook-static --port 6006 --silent &
          sleep 5

      - name: Run visual regression
        timeout-minutes: 12
        run: npm run vrt

      - name: Upload diff images
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: vrt-diffs
          path: vrt/diffs/
          if-no-files-found: ignore

  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [lint, build, a11y-tests, automation, visual-regression]
    if: always()
    steps:
      - name: Check all jobs
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "One or more required jobs failed"
            exit 1
          fi
          echo "All required jobs passed"
