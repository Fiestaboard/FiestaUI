name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

  build:
    name: Build package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Build
        run: npm run build

      - name: Verify dist contents
        run: |
          test -f dist/index.js
          test -f dist/index.d.ts
          test -f dist/theme.css
          npm pack --dry-run

  automation:
    name: Automation scripts & workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Shellcheck upgrade scripts
        run: shellcheck scripts/downstream-upgrade/*.sh scripts/downstream-upgrade/tests/*.sh

      - name: Run script tests
        run: bash scripts/downstream-upgrade/tests/run.sh

      - name: actionlint
        run: |
          bash <(curl -sSf https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

  a11y-tests:
    name: Accessibility Tests (${{ matrix.theme }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        theme: [dark, light]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-a11y-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build Storybook
        run: npm run build-storybook -- --quiet

      - name: Start Storybook static server
        run: |
          npx http-server storybook-static --port 6006 --silent &
          sleep 5

      - name: Run Storybook a11y tests
        timeout-minutes: 8
        run: |
          URL="http://localhost:6006"
          if [ "${{ matrix.theme }}" = "light" ]; then
            URL="${URL}?globals=theme:light"
          fi
          npm run test-storybook:ci -- --url "$URL"

  visual-regression:
    name: Visual Regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-a11y-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build Storybook
        run: npm run build-storybook -- --quiet

      - name: Start Storybook static server
        run: |
          npx http-server storybook-static --port 6006 --silent &
          sleep 5

      - name: Run visual regression
        timeout-minutes: 12
        run: npm run vrt

      - name: Upload diff images
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: vrt-diffs
          path: vrt/diffs/
          if-no-files-found: ignore

  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [lint, build, a11y-tests, automation, visual-regression]
    if: always()
    steps:
      - name: Check all jobs
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "One or more required jobs failed"
            exit 1
          fi
          echo "All required jobs passed"
