name: CI

on:
  push:
    branches: [main]
  pull_request:
  # `main` runs behind a merge queue, and a queued entry is a *different commit*
  # from the PR head — it is the PR replayed on top of every entry ahead of it.
  # `CI Success` is the queue's required check, so this workflow has to run on
  # `merge_group` or the queue would wait on a check that never reports and
  # every merge would hang until it timed out.
  #
  # Testing that commit is the entire point. release.yml's header already names
  # the hazard this closes: the PR check tests the PR head, not the merge
  # result, so two independently green PRs can combine into a red `main`. This
  # repo is unusually exposed to it because `vrt/baselines/` is committed —
  # PR A changing a token silently invalidates PR B's baselines, and neither
  # PR is red on its own.
  merge_group:
  # Manual runs of the full suite. The baseline-seeding input that used to live
  # here is gone: it existed only because vrt-update.yml could not be dispatched
  # until it reached the default branch, which it has. Seeding and rebaselining
  # are vrt-update.yml's job, and duplicating them here would mean maintaining
  # two sharded fan-outs that rewrite the same tree.
  workflow_dispatch:

jobs:
  # `CI Success` is the one required check on `main`, so this workflow must run
  # — and report — on every PR, without exception. That rules out a top-level
  # `paths-ignore`: it would suppress the whole run, the check would never
  # report, and the PR would be unmergeable forever. (Same failure mode as a
  # `[skip ci]` commit message, which is what this job exists to make
  # unnecessary.) Instead the workflow always runs and this job decides which
  # of the expensive jobs are worth spending 20 minutes on.
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Pinned rather than relying on the runner image's preinstalled node:
      # this job gates every other job, so its behaviour should not change with
      # an image bump. No `npm ci` — the classifier is dependency-free.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      # Prose and the audit crons' bookkeeping files can't move a pixel or a
      # byte of dist/, so build/a11y/VRT/bundle have nothing to say about them.
      # They are still fully checked: `npm run format:check` is `prettier
      # --check .`, which covers *.md and *.json, and lint/automation always
      # run. Anything this can't classify with confidence runs the full suite.
      - name: Classify
        id: classify
        env:
          # `merge_group` carries neither a `pull_request` nor an `event.before`.
          # Without its own case the fallbacks below resolve to an empty base and
          # every queued entry would run the full 25-minute suite — including the
          # release bot's prose-only merges. The merge_group payload does supply
          # both shas, so classification stays exact inside the queue.
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: |
          set -euo pipefail

          run_everything() {
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "$1 — running the full suite."
            exit 0
          }

          # workflow_dispatch has no base; a branch's first push reports the
          # all-zero sha; a force-push can orphan the old tip.
          case "$BASE_SHA" in
            "" | 0000000000000000000000000000000000000000)
              run_everything "No base ref to diff against" ;;
          esac
          for sha in "$BASE_SHA" "$HEAD_SHA"; do
            git cat-file -e "${sha}^{commit}" 2>/dev/null \
              || run_everything "Commit ${sha} is not in this checkout"
          done

          files=$(git diff --name-only "${BASE_SHA}...${HEAD_SHA}")
          if [ -z "$files" ]; then
            run_everything "Diff is empty"
          fi

          echo "Changed files:"
          echo "$files"

          # The path rule lives in scripts/ci/classify-changes.mjs, not inline
          # here, because release.yml's gate has to apply the identical rule to
          # decide whether a merge earns a version. Two copies would drift, and
          # a drifted copy fails silently in the worst direction — releasing on
          # every audit bookkeeping commit, or skipping a real change. The
          # script writes `code=<bool>` to stdout and its rationale to stderr.
          echo "$files" | node scripts/ci/classify-changes.mjs >> "$GITHUB_OUTPUT"

  # Sizes the two sharded suites. Separate from `changes` because it answers a
  # different question — `changes` decides IF the expensive jobs run, this
  # decides HOW WIDE they run — and because both are cheap enough that keeping
  # them independent costs nothing while letting either be read on its own.
  #
  # Deliberately not gated on `needs.changes`: a matrix's `strategy` is
  # evaluated before `if`, so a skipped planner leaves the VRT and a11y
  # matrices with no shard list at all and GitHub errors the workflow rather
  # than skipping the jobs. It runs always and stays cheap; the `if` on the
  # consuming jobs is what actually skips the work.
  plan-shards:
    name: Plan test shards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      vrt_shards: ${{ steps.plan.outputs.vrt_shards }}
      vrt_shard_count: ${{ steps.plan.outputs.vrt_shard_count }}
      a11y_shards: ${{ steps.plan.outputs.a11y_shards }}
      a11y_shard_count: ${{ steps.plan.outputs.a11y_shard_count }}
    steps:
      - uses: actions/checkout@v7

      # No `npm ci` — the planner is dependency-free and only counts files, so
      # this job is seconds. Pinned node for the same reason `changes` pins it.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      # Counts the committed baseline tree and derives a shard count from it,
      # so the job count tracks the suite instead of being a number someone has
      # to remember to bump. Rule and rationale live in the script.
      - name: Plan
        id: plan
        run: node scripts/ci/plan-shards.mjs >> "$GITHUB_OUTPUT"

  lint:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Gated like build/a11y/VRT rather than run unconditionally like lint: this
    # job only exercises src/, so a prose-only PR has nothing for it to say.
    # A test-only PR still runs it — scripts/ci/classify-changes.mjs counts
    # `src/**/*.test.tsx` as CODE (it is only excluded from *shipping*), so the
    # PRs that add coverage are never the ones that skip the coverage run.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit

      # jsdom, no browser download — this is the fast half of the test estate.
      # Behaviour, roles and ARIA live here; appearance stays in VRT and the
      # Storybook a11y run, which are the jobs that own a real browser.
      - name: Vitest
        run: npm test

  build:
    name: Build package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Build
        run: npm run build

      - name: Verify dist contents
        run: |
          test -f dist/index.js
          test -f dist/index.d.ts
          test -f dist/theme.css
          npm pack --dry-run

  perf-bundle:
    name: Bundle Budget
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Needs a base to compare against, so PRs only.
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      # Installed ONCE, at head, and never reinstalled. Reinstalling at base
      # would uninstall esbuild on any PR that touches package-lock.json —
      # including the PR that first added it. Holding dependencies fixed also
      # isolates the source change, which is the only thing being gated.
      - name: Install dependencies
        run: npm ci --no-audit

      # Both measurements MUST run the same harness code, and they do: the
      # checkouts below are path-scoped to the build inputs and never touch
      # scripts/, so scripts/perf stays at the head revision throughout. Do
      # not turn these into a full `git checkout <sha>` — that would swap the
      # harness out from under the base measurement.
      #
      # Running it from a copy outside the workspace does NOT work: Node
      # resolves bare imports from the importing file's directory, so a copy
      # in $RUNNER_TEMP cannot find esbuild.
      #
      # The build is spelled out INLINE rather than run through an npm script,
      # and that is deliberate on both counts:
      #
      #   * No `tsc`. The measurement reads dist/index.js and theme.css and
      #     never opens a .d.ts, so the declaration emit is not part of what
      #     this job gates — and including it makes the base unbuildable on any
      #     PR that REMOVES a dependency. Dependencies are held at head by
      #     design (see above), so base source importing a package the PR
      #     deleted fails `tsc` with TS2307, even though vite treats it as
      #     external and has already emitted the bundle being measured.
      #   * No `npm run <script>`. The checkout below replaces package.json
      #     with the BASE revision, so any script added by the PR does not
      #     exist during "Measure base". A script-based fix here fails with
      #     "Missing script" on exactly the PRs it was written to unblock.
      - name: Measure base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git checkout --quiet --force "$BASE_SHA" -- \
            src package.json vite.config.ts tsconfig.build.json
          # Base's package.json is now in place, so this adds back any
          # dependency the PR REMOVES — without it, measureTotal cannot weigh
          # code that base still imports and the comparison is not like for
          # like. --no-package-lock keeps the head lockfile untouched, and the
          # `|| true` is deliberate: bundle.mjs externalises anything still
          # missing and warns, so a registry blip degrades the number instead
          # of failing the PR.
          npm install --no-save --no-package-lock --no-audit --no-fund || true
          npx vite build
          cp src/styles/theme.css dist/theme.css
          cp src/styles/fonts.css dist/fonts.css
          cp src/styles/editor.css dist/editor.css
          node scripts/perf/bundle.mjs measure \
            --out "$RUNNER_TEMP/base.json" --dist "$GITHUB_WORKSPACE/dist"

      - name: Measure head
        run: |
          set -euo pipefail
          git checkout --quiet --force HEAD -- \
            src package.json vite.config.ts tsconfig.build.json
          # Symmetry with "Measure base": that step installed BASE's dependency
          # set into node_modules, so head must restore its own before being
          # measured. Without this, head is weighed against a tree that still
          # contains whatever base had and this PR removed.
          npm install --no-save --no-package-lock --no-audit --no-fund || true
          npx vite build
          cp src/styles/theme.css dist/theme.css
          cp src/styles/fonts.css dist/fonts.css
          cp src/styles/editor.css dist/editor.css
          node scripts/perf/bundle.mjs measure \
            --out "$RUNNER_TEMP/head.json" --dist "$GITHUB_WORKSPACE/dist"

      - name: Compare
        id: compare
        run: |
          set +e
          node scripts/perf/bundle.mjs compare \
            --base "$RUNNER_TEMP/base.json" \
            --head "$RUNNER_TEMP/head.json" \
            --markdown "$RUNNER_TEMP/report.md"
          code=$?
          set -e
          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"

      # Report-only during rollout. Promoting this to a hard failure (with the
      # perf-budget-ok escape hatch) is a follow-up, once the numbers have
      # proven stable on real PRs — see the plan's Task 5.
      - name: Report result
        env:
          COMPARE_EXIT: ${{ steps.compare.outputs.exit_code }}
        run: |
          if [ "$COMPARE_EXIT" != "0" ]; then
            echo "::warning::Bundle budget regression detected (report-only during rollout)."
          else
            echo "No bundle regressions."
          fi

  automation:
    name: Automation scripts & workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Shellcheck upgrade scripts
        run: shellcheck scripts/downstream-upgrade/*.sh scripts/downstream-upgrade/tests/*.sh

      - name: Run script tests
        run: bash scripts/downstream-upgrade/tests/run.sh

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      # The perf/release test suites started as dependency-free, but newer
      # regression tests import real modules from src/ (bundled with esbuild)
      # and their runtime deps (tailwind-merge, clsx), so the job now installs.
      - name: Install dependencies
        run: npm ci

      - name: Run perf harness unit tests
        run: npm run perf:test

      # Guards the two decisions that publish: whether a merge changes shipped
      # code, and what version it earns.
      - name: Run release gate unit tests
        run: npm run release:test

      - name: actionlint
        run: |
          bash <(curl -sSf https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

  a11y-tests:
    name: Accessibility Tests (${{ matrix.theme }} ${{ matrix.shard }}/${{ needs.plan-shards.outputs.a11y_shard_count }})
    runs-on: ubuntu-latest
    # Was 15 for the whole unsharded theme. A shard does a fraction of the work
    # behind the same ~65s of setup, so the budget follows it down.
    timeout-minutes: 10
    needs: [changes, plan-shards]
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      # Two dimensions, and they are not interchangeable. `theme` is a
      # Storybook global baked into the URL, so it must be a separate axis —
      # each leg re-visits every story it owns under one theme. `shard` splits
      # the story list within a theme. Legs = themes x shards.
      matrix:
        theme: [dark, light]
        shard: ${{ fromJSON(needs.plan-shards.outputs.a11y_shards) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-a11y-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build Storybook
        run: npm run build-storybook -- --quiet

      - name: Start Storybook static server
        run: |
          npx http-server storybook-static --port 6006 --silent &
          sleep 5

      # `--shard` is the test runner's own flag (it is Jest underneath), so a11y
      # needs no harness code of its own — unlike VRT, whose runner we wrote.
      # The shard TOTAL comes from the planner rather than `strategy.job-total`,
      # which counts every leg: with the theme axis that is 2N, and each job
      # would claim to be shard i of 2N while only N slices exist.
      - name: Run Storybook a11y tests
        timeout-minutes: 8
        env:
          THEME: ${{ matrix.theme }}
          SHARD: ${{ matrix.shard }}
          SHARD_TOTAL: ${{ needs.plan-shards.outputs.a11y_shard_count }}
        run: |
          URL="http://localhost:6006"
          if [ "$THEME" = "light" ]; then
            URL="${URL}?globals=theme:light"
          fi
          npm run test-storybook:ci -- --url "$URL" --shard "${SHARD}/${SHARD_TOTAL}"

  visual-regression:
    name: Visual Regression (${{ matrix.shard }}/${{ needs.plan-shards.outputs.vrt_shard_count }})
    runs-on: ubuntu-latest
    # Was 35 for one job shooting all ~2,100 shots. A shard shoots ~1/N of them
    # behind the same ~65s of setup, and the planner caps N so a shard never
    # carries more than ~150 shots (~40s of shooting) unless the cap binds.
    timeout-minutes: 15
    needs: [changes, plan-shards]
    if: needs.changes.outputs.code == 'true'
    strategy:
      # Independent slices: one shard finding drift says nothing about whether
      # the others would, and cancelling them would hide the rest of the drift
      # behind whichever shard happened to fail first.
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan-shards.outputs.vrt_shards) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-a11y-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build Storybook
        run: npm run build-storybook -- --quiet

      - name: Start Storybook static server
        run: |
          npx http-server storybook-static --port 6006 --silent &
          sleep 5

      # Shard 1 additionally owns the whole-suite inventory checks (new, stale
      # and stray baselines) so they are reported once per run rather than once
      # per shard — see scripts/vrt/shard.mjs.
      - name: Run visual regression
        timeout-minutes: 10
        env:
          SHARD: ${{ matrix.shard }}
          SHARD_TOTAL: ${{ needs.plan-shards.outputs.vrt_shard_count }}
        run: npm run vrt -- --shard "${SHARD}/${SHARD_TOTAL}"

      # Artifact names must be unique within a run, so the shard index is part
      # of the name; without it the matrix legs collide and only one upload
      # survives. Download them all at once with the `vrt-diffs-*` pattern.
      - name: Upload diff images
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: vrt-diffs-${{ matrix.shard }}
          path: vrt/diffs/
          if-no-files-found: ignore

  # The single required status check on `main`. `if: always()` is what makes it
  # report rather than inherit a skip — a job that skipped because `changes`
  # ruled it irrelevant is a pass, not a failure, so only `failure` and
  # `cancelled` are treated as red. `changes` is in `needs` so that a broken
  # classifier fails the merge gate instead of silently skipping everything —
  # and `plan-shards` for the same reason, one step further out: a planner that
  # emitted a malformed shard list would leave the VRT and a11y matrices
  # unbuilt, and an unbuilt matrix reports as skipped, which this job reads as
  # a pass. Depending on the planner directly makes that failure red instead.
  #
  # A matrix job contributes one entry to `needs.*.result` per leg, so a single
  # red shard out of fifteen fails the gate — which is what `fail-fast: false`
  # buys: every shard reports its own drift before the gate closes.
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [changes, plan-shards, lint, unit-tests, build, a11y-tests, automation, visual-regression]
    if: always()
    steps:
      - name: Check all jobs
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "One or more required jobs failed"
            exit 1
          fi
          echo "All required jobs passed"
