name: Release

# Manually triggered release: bumps the version, tags, publishes to the
# GitHub Packages npm registry, and creates a GitHub Release.
#
# Publishing authenticates with the workflow's built-in GITHUB_TOKEN
# (`packages: write`) — no npm account, no long-lived secrets, nothing to
# rotate. The package is published to https://npm.pkg.github.com under the
# @fiestaboard scope (see package.json publishConfig) and inherits the
# repo's public visibility.
#
# NOTE: GitHub Packages requires authentication to INSTALL, even for
# public packages. Consumers need a token with read:packages — see README.
# If the package later moves to registry.npmjs.org, switch this workflow
# to npm Trusted Publishing (OIDC).
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Semver bump type"
        type: choice
        options: [patch, minor, major]
        default: patch
        required: true

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          registry-url: "https://npm.pkg.github.com"
          scope: "@fiestaboard"

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Build
        run: npm run build

      - name: Bump version and tag
        id: version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          npm version "${{ inputs.bump }}" -m "chore: release v%s"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Publish to GitHub Packages
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push version commit and tag
        run: git push --follow-tags origin main

      - name: Create GitHub Release
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            --title "v${{ steps.version.outputs.version }}" \
            --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

  # After a successful publish, keep the evergreen upgrade PR on
  # Fiestaboard/FiestaBoard pointed at this release.
  downstream-upgrade:
    needs: release
    uses: ./.github/workflows/downstream-upgrade.yml
    with:
      version: ${{ needs.release.outputs.version }}
    secrets: inherit
