name: Release

# Releases are batched through Changesets. Every PR that changes what ships adds
# a `.changeset/*.md` file (ci.yml's release-guards job enforces it). On each
# push to `main` or `alpha`, changesets/action does exactly one of two things:
#
# - changesets are pending: open or update ONE "chore: release" Version PR that
#   consumes them, bumps package.json, and writes CHANGELOG.md;
# - none are pending: publish whatever version package.json declares that npm
#   does not have yet. Merging the Version PR is what makes that true, so a
#   version reaches npm only when a maintainer merges it — many merges, one
#   build. Re-running is safe: `changeset publish` skips versions npm has.
#
# `main` publishes to the `latest` dist-tag. `alpha` runs in Changesets pre mode
# (`.changeset/pre.json`, tag `alpha`) and publishes `X.Y.Z-alpha.N` to `alpha`.
# See docs/releasing.md for the alpha lifecycle. This replaced the
# publish-on-every-merge flow (gate.mjs / land.mjs) described in
# docs/superpowers/specs/2026-08-07-continuous-release-design.md.
#
# Trigger is `push`, not `workflow_run` on CI as before. Two reasons:
# - `main` merges through a queue whose `merge_group` CI tests the merged
#   commit, so a push here is already the green result — the hazard
#   workflow_run existed to close (two green PRs combining into a red main).
#   `alpha` has no queue (merge commits for syncs); its PR-head CI is the bar,
#   which is acceptable for a prerelease channel.
# - workflow_run runs with GITHUB_REF set to the default branch, and
#   changesets/action takes its branch from GITHUB_REF: an alpha run would
#   open its Version PR against main.
#
# Publishing uses npm Trusted Publishing (OIDC): `id-token: write` lets npm mint
# a short-lived credential. The trusted-publisher record on npmjs names THIS
# FILE (`release.yml`) — renaming it breaks publishing. NODE_AUTH_TOKEN below is
# a fallback npm only uses if the OIDC exchange fails; drop it once OIDC has
# published cleanly through this workflow.
on:
  push:
    branches: [main, alpha]
  # Re-run lever after an infrastructure failure. Pick the branch in the UI.
  workflow_dispatch:

permissions:
  contents: write # tags and GitHub Releases (with the app token, below)
  id-token: write # OIDC credential for npm Trusted Publishing

# Per branch, so an alpha release never waits on a main one. Never cancelled:
# killing a run between `npm publish` and the tag push strands a published
# version untagged.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Version PR or publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      published-packages: ${{ steps.changesets.outputs.published-packages }}
    steps:
      # The Claude bot app token, not GITHUB_TOKEN: a Version PR opened with
      # GITHUB_TOKEN has its `pull_request` CI born gated in `action_required`,
      # so the required `CI Success` waits on a manual approval every release.
      - name: Mint app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.CLAUDE_BOT_APP_ID }}
          private-key: ${{ secrets.CLAUDE_BOT_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      # No dependency cache: npm's trusted-publishing guidance is to build
      # release artifacts from a clean install, so a poisoned cache entry
      # cannot reach a published tarball.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci --no-audit

      # alpha publishes only in alpha pre mode. In exit mode (a promotion to
      # main in progress) the action would open a STABLE Version PR against
      # alpha and publish it to `latest`, so the step below is skipped; with no
      # pre.json at all this fails the run. See scripts/release/pre-mode.mjs.
      - name: Check alpha prerelease mode
        id: alpha
        if: github.ref_name == 'alpha'
        run: node scripts/release/pre-mode.mjs alpha-action >> "$GITHUB_OUTPUT"

      # Trusted Publishing needs npm >= 11.5.1; Node 24 ships an older 11.x.
      - name: Update npm
        run: npm install -g npm@latest

      # v2, not v1: v1 supports Changesets v2 only and, against the v3 CLI,
      # publishes without ever reporting `published` — so no tag, no GitHub
      # Release, no downstream dispatch. v2 does no .npmrc handling of its own;
      # auth is setup-node's .npmrc plus npm's OIDC exchange.
      - name: Version PR or publish
        id: changesets
        if: github.ref_name != 'alpha' || steps.alpha.outputs.action == 'release'
        uses: changesets/action@v2
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          version-script: npm run version-packages
          publish-script: npm run release
          pr-title: "chore: release"
          commit-message: "chore: release"
          create-github-releases: true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"

  # After a stable publish, keep the evergreen upgrade PRs downstream pointed
  # at this release, by DISPATCHING downstream-upgrade.yml as its own run rather
  # than calling it as a job of this one: its FiestaBoard leg runs Claude for
  # 45+ minutes, and a called workflow would hold this branch's release queue
  # for all of it. scripts/ci/tests/release-decoupled.test.mjs pins this.
  #
  # Alphas are not dispatched: downstream tracks `latest`.
  #
  # A workflow_dispatch made with GITHUB_TOKEN does start a run (it is one of
  # the two events exempt from the GITHUB_TOKEN no-trigger rule).
  downstream-upgrade:
    name: Dispatch downstream upgrade
    needs: release
    if: needs.release.outputs.published == 'true' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write # create the workflow_dispatch event
    steps:
      - name: Dispatch downstream-upgrade.yml
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHED: ${{ needs.release.outputs.published-packages }}
        run: |
          set -euo pipefail
          VERSION=$(jq -r '.[] | select(.name == "@fiestaboard/ui") | .version' <<< "$PUBLISHED")
          if [ -z "$VERSION" ]; then
            echo "::error::@fiestaboard/ui is not in published-packages: ${PUBLISHED}"
            exit 1
          fi
          gh workflow run downstream-upgrade.yml \
            --repo "$GITHUB_REPOSITORY" --ref main -f version="$VERSION"
          echo "Dispatched downstream upgrade to v${VERSION}." >> "$GITHUB_STEP_SUMMARY"
