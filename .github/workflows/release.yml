name: Release

# Manually triggered release: bumps the version, tags, publishes to the
# GitHub Packages npm registry, and creates a GitHub Release.
#
# Publishing authenticates with the workflow's built-in GITHUB_TOKEN
# (`packages: write`) — no npm account, no long-lived secrets, nothing to
# rotate. The package is published to https://npm.pkg.github.com under the
# @fiestaboard scope (see package.json publishConfig) and inherits the
# repo's public visibility.
#
# NOTE: GitHub Packages requires authentication to INSTALL, even for
# public packages. Consumers need a token with read:packages — see README.
# If the package later moves to registry.npmjs.org, switch this workflow
# to npm Trusted Publishing (OIDC).
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Semver bump type"
        type: choice
        options: [patch, minor, major]
        default: patch
        required: true

permissions:
  contents: write
  packages: write
  # Landing the version commit via PR needs more than contents: an explicit
  # permissions block zeroes everything unlisted, which broke `gh pr create`
  # ("Resource not accessible by integration") on the v1.0.1 release.
  pull-requests: write # create + auto-merge the version PR
  actions: write # dispatch ci.yml on the release branch
  # The called downstream-upgrade.yml requests issues: write (adoption pass
  # files component-request issues); a reusable workflow may not request more
  # than its caller grants, so omitting this fails the run at startup.
  issues: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          registry-url: "https://npm.pkg.github.com"
          scope: "@fiestaboard"

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Build
        run: npm run build

      - name: Bump version and tag
        id: version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          npm version "${{ inputs.bump }}" -m "chore: release v%s"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Publish to GitHub Packages
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # main's ruleset requires changes via PR with CI Success, so the version
      # commit can't be pushed directly (the v1.0.0 release learned this the
      # hard way: tag+publish landed, the commit bounced). Push the tag, then
      # land the version commit through an auto-merged PR.
      - name: Push tag
        run: git push origin "v${{ steps.version.outputs.version }}"

      - name: Land version commit via PR
        run: |
          BRANCH="release/v${{ steps.version.outputs.version }}"
          git push origin "HEAD:${BRANCH}"
          gh pr create --head "${BRANCH}" --base main \
            --title "chore: release v${{ steps.version.outputs.version }}" \
            --body "Version commit for the published v${{ steps.version.outputs.version }} release. Auto-merges when CI passes."
          # --merge (not --squash) so the tagged commit itself becomes
          # reachable from main instead of dangling behind the tag.
          gh pr merge "${BRANCH}" --auto --merge --delete-branch
          # The PR's CI run is born gated: pull_request runs for bot-created
          # PRs sit in "action_required" until approved, and only checks from
          # the pull_request suite count toward the PR's required "CI Success"
          # check — a workflow_dispatch run's checks attach to the commit but
          # never associate with the PR (learned the hard way on v1.0.2).
          # Wait for the gated run to appear, then approve it. Auto-merge is
          # already armed above, so if approval fails this step fails loudly
          # and a human just approves the run — nothing else is lost.
          RUN_ID=""
          for _ in $(seq 1 24); do
            RUN_ID=$(gh run list --branch "${BRANCH}" --event pull_request \
              --json databaseId,conclusion \
              --jq '[.[] | select(.conclusion == "action_required")][0].databaseId // empty')
            [ -n "${RUN_ID}" ] && break
            sleep 5
          done
          if [ -z "${RUN_ID}" ]; then
            echo "::error::No gated pull_request CI run appeared for ${BRANCH}"
            exit 1
          fi
          gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/approve"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Create GitHub Release
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            --title "v${{ steps.version.outputs.version }}" \
            --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

  # After a successful publish, keep the evergreen upgrade PR on
  # Fiestaboard/FiestaBoard pointed at this release.
  downstream-upgrade:
    needs: release
    uses: ./.github/workflows/downstream-upgrade.yml
    with:
      version: ${{ needs.release.outputs.version }}
    secrets: inherit
