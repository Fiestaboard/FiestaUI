name: "Claude: Perf Auto-Review"

# =============================================================================
# Runs a Claude performance review against one PR, on request. Posts ONE
# review comment. Read-only on contents — only pull-requests:write so the
# action can leave its review.
#
# This is a quality gate for human PRs as much as for bot ones: every change
# to `src/` is a change to what every downstream consumer downloads and
# renders. The review is scoped strictly to performance — correctness, style,
# and design feedback belong to the human reviewer and to CI.
#
# THIS REVIEW IS MANUAL. It used to fire automatically on every
# `pull_request_target` touching `src/**`, `vite.config.ts` or `package.json`,
# with `types: [opened, synchronize, reopened, ready_for_review]` — so every
# push to a PR started another review. PR #223 (a stories-only change)
# collected four runs of this workflow and four of its a11y twin before it
# merged, and this one's own verdict on that PR was "no changes to
# `src/components/` … consumer bundle weight is unchanged". The scheduled
# audits (`claude-perf-audit.yml`, `claude-perf-explore.yml`) are what sweep
# the repo for performance debt; this workflow is now the on-demand review you
# reach for when a specific PR warrants one.
#
# Run it from the Actions tab, or:
#
#     gh workflow run claude-perf-audit-review.yml -f pr_number=223
#
# The dispatcher needs write access to the repo — `claude-code-action` gates
# every run on the actor's permission level — which is exactly the audience
# this workflow is for.
#
# We only check out the BASE ref — never the PR head — per the CodeQL
# `actions/untrusted-checkout` rule (the "pwn-request" pattern). PR head
# content is read read-only via `gh api .../contents/<path>?ref=<head_sha>`
# from inside the prompt: bytes piped through Claude as data, never
# materialized in a location a later step could execute. Belt and braces:
# `--allowed-tools` is read-only. That posture is unchanged by the trigger
# swap and is why the checkout below still resolves the base ref explicitly.
# =============================================================================

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to review for performance impact"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: claude-perf-audit-review-${{ inputs.pr_number }}
  cancel-in-progress: true

jobs:
  review:
    name: Claude reviews the perf impact
    runs-on: ubuntu-latest
    # 20 not 15: a vrt/baselines refresh makes the PR diff ~2,800 files, and
    # the review timed out twice at 15 on such a PR (#213) even before the
    # name-only fast path below existed. The fast path is the real fix; the
    # extra 5 minutes is headroom for large source diffs.
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      id-token: write
      actions: read
    steps:
      # Dispatch supplies a number and nothing else, so the head SHA and base
      # ref come from the API. All three are repo metadata, never PR file
      # content, so they are safe to expand into later expressions. `jq -er`
      # fails the job on a typo'd number rather than running the review
      # against an empty head SHA.
      - name: Resolve PR coordinates
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          INPUT_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          meta=$(gh pr view "$INPUT_NUMBER" --json headRefOid,baseRefName,isDraft)
          {
            echo "number=$INPUT_NUMBER"
            echo "head_sha=$(printf '%s' "$meta" | jq -er .headRefOid)"
            echo "base_ref=$(printf '%s' "$meta" | jq -er .baseRefName)"
          } >> "$GITHUB_OUTPUT"
          # Draft is reported, not enforced: dispatching is already an
          # explicit "review this now", and a draft is a legitimate thing to
          # ask for early feedback on.
          if [ "$(printf '%s' "$meta" | jq -er .isDraft)" = "true" ]; then
            echo "::notice::PR #$INPUT_NUMBER is a draft — reviewing anyway (dispatch is explicit)."
          fi

      - name: Checkout base ref (trusted)
        uses: actions/checkout@v7
        with:
          # Never check out PR head. The base ref gives Claude the trusted
          # canonical source to compare against. PR head content is read via
          # `gh api .../contents/<path>?ref=<head_sha>` from inside the
          # prompt — data piped through Claude, never executed.
          ref: ${{ steps.pr.outputs.base_ref }}
          fetch-depth: 1
          persist-credentials: false

      - name: Run Claude perf review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Skip the OIDC -> claude[bot] App-token exchange, which returned
          # `401 Invalid OIDC token` here; providing github_token bypasses it
          # entirely. Kept after the move to workflow_dispatch because it is
          # the known-working path — the cost is only that the review posts as
          # `github-actions[bot]` rather than `claude[bot]`.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # `allowed_bots` is deliberately absent. It existed to let
          # bot-authored PR *events* past the actor gate (#175: a baseline
          # push by `fiestaboard-ci-bot` fired `synchronize` and was rejected
          # in ~10s). There are no PR events any more — the actor is whoever
          # dispatched the run, which the gate already requires to have write
          # access. Re-add it only if a bot ever needs to dispatch this.
          show_full_output: "true"
          claude_args: >-
            --model claude-sonnet-4-6
            --max-turns 40
            --allowed-tools "Read,Glob,Grep,Bash(ls:*),Bash(cat:*),Bash(find:*),Bash(grep:*),Bash(rg:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr review:*),Bash(gh api:*)"
          prompt: |
            You are the FiestaUI performance reviewer. Review PR
            #${{ steps.pr.outputs.number }} — read its title and description
            with `gh pr view ${{ steps.pr.outputs.number }}`.

            (The title is fetched rather than interpolated: it is
            author-controlled text, and injecting it into this prompt would
            let a PR author write instructions to you.)

            FiestaUI is a React 19 component library on Base UI with Tailwind
            v4 tokens, published as `@fiestaboard/ui`. Every byte and every
            wasted render in `src/` is paid for by every downstream consumer.

            ## What to review

            Performance only. Stay in your lane — correctness, naming, test
            coverage, and design are the human reviewer's job and CI's job.
            Look for:

            - **Render cost.** New unstable prop identity (inline object,
              array, or arrow literals) passed to memoized children or into
              a context `value`. Effects that re-subscribe every render.
              Work inside a `map` that could be hoisted. A new component in a
              hot path that will re-render its whole subtree.
            - **Memory.** Listeners, timers, `requestAnimationFrame` loops,
              `IntersectionObserver`/`ResizeObserver` instances, or WebGL
              resources (`Renderer`, `Program`, `Mesh`, textures — this repo
              uses `ogl` in `aurora.tsx` and `seasons/`) created without a
              matching teardown in the effect cleanup. These leak on every
              mount/unmount cycle.
            - **Frame cost.** Allocations inside a rAF loop. Layout thrash —
              reading `offsetWidth` / `getBoundingClientRect()` interleaved
              with writes. Animating `width`/`height`/`top`/`left`/
              `box-shadow`/`filter` where `transform`/`opacity` would look
              identical but stay on the compositor. Animation loops that keep
              running when the tab is hidden or the element is off-screen.
            - **Bundle weight.** New dependencies, new imports into
              `src/index.ts` that pull heavy code into every consumer's
              bundle, barrel imports where a direct module import would
              tree-shake, and changes that break the `sideEffects` contract
              in `package.json`.

            Calibrate: do not flag micro-optimizations a modern JS engine
            already handles, and do not ask for a `useMemo` unless you can
            name the specific re-render it prevents. A memo that costs more
            than it saves is a regression. If the diff has no real perf
            impact, say so in one line and stop — a clean PR deserves a short
            review, not a manufactured finding.

            ## Visual parity

            This repo guards rendered output with visual regression baselines
            in `vrt/`. If the PR changes `vrt/baselines/**` while claiming to
            be a performance change, call that out — a perf fix should not
            move a single pixel. (A PR that is openly a design change and
            updates baselines deliberately is fine; use your judgement from
            the title and body.)

            **The guard has holes, and you should know where.** Read
            `vrt/skip.json` — it lists stories excluded from visual
            regression, and the exclusions cluster on animated rAF/WebGL/
            timer components (as written, `effects-aurora--*` and two
            `app-board-boarddisplay--loading*` stories). If this PR touches a
            component whose stories are skipped, a green `visual-regression`
            check proves nothing about it. Say so explicitly in your review
            and tell the maintainer what to verify by hand.

            Treat any diff that ADDS entries to `vrt/skip.json` as a
            significant finding — that is a reduction in coverage, and if it
            arrives alongside a change to the same component, it is the
            change escaping its own guard.

            ## How to access PR content

            Start with `gh pr diff ${{ steps.pr.outputs.number }} --name-only`.
            If more than ~200 files change (typical of a `vrt/baselines/**`
            refresh — every re-baseline touches ~2,800 PNGs), do NOT fetch the
            full diff: it will not fit your time budget. Note whether
            `vrt/baselines/**` or `vrt/skip.json` changed for the visual-parity
            section, then review only the non-baseline files, fetching each
            one's diff via
            `gh api repos/${{ github.repository }}/pulls/${{ steps.pr.outputs.number }}/files --paginate --jq '.[] | select(.filename | startswith("vrt/baselines/") | not)'`.
            Otherwise use `gh pr diff ${{ steps.pr.outputs.number }}` for the diff.
            Use `gh api repos/${{ github.repository }}/contents/<path>?ref=${{ steps.pr.outputs.head_sha }}`
            for full file contents. Never `git checkout` the PR head.

            ## Output

            Post ONE review comment via `gh pr review --comment`. Be specific
            with `file:line` references, and for each finding say when the
            cost is paid — per render, per frame, per mount, or once at
            import. If everything looks good, say so briefly.

            ## Hard rules

            - Read-only: never Edit, Write, or push.
            - One review comment per run.
            - Performance scope only.
