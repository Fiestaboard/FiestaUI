name: "Claude: A11y Auto-Review"

# =============================================================================
# Runs a Claude accessibility review against one PR, on request. Posts ONE
# review comment. Read-only on contents — only pull-requests:write so the
# action can leave its review.
#
# This is a quality gate for human PRs as much as for bot ones. CI's
# `a11y-tests` job already runs axe over every story in both themes and blocks
# the merge on failure, so this review deliberately does NOT re-check what axe
# checks. It reviews the things axe structurally cannot see: keyboard and focus
# behaviour, motion preferences in JavaScript, the quality of an accessible
# name rather than its presence, and any diff that quietly reduces a11y
# coverage.
#
# THIS REVIEW IS MANUAL. It used to fire automatically on every
# `pull_request_target` touching `src/**`, `.storybook/**` or
# `eslint.config.mjs`, with `types: [opened, synchronize, reopened,
# ready_for_review]` — so every push to a PR started another review. PR #223
# (a stories-only change) collected four runs of this workflow and four of its
# perf twin before it merged. The scheduled audit (`claude-a11y-audit.yml`) is
# what sweeps the repo for accessibility debt; this workflow is now the
# on-demand review you reach for when a specific PR warrants one.
#
# Run it from the Actions tab, or:
#
#     gh workflow run claude-a11y-audit-review.yml -f pr_number=223
#
# The dispatcher needs write access to the repo — `claude-code-action` gates
# every run on the actor's permission level — which is exactly the audience
# this workflow is for.
#
# We only check out the BASE ref — never the PR head — per the CodeQL
# `actions/untrusted-checkout` rule (the "pwn-request" pattern). PR head
# content is read read-only via `gh api .../contents/<path>?ref=<head_sha>`
# from inside the prompt: bytes piped through Claude as data, never
# materialized in a location a later step could execute. Belt and braces:
# `--allowed-tools` is read-only. That posture is unchanged by the trigger
# swap and is why the checkout below still resolves the base ref explicitly.
# =============================================================================

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to review for accessibility impact"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: claude-a11y-audit-review-${{ inputs.pr_number }}
  cancel-in-progress: true

jobs:
  review:
    name: Claude reviews the accessibility impact
    runs-on: ubuntu-latest
    # 20 not 15: a vrt/baselines refresh makes the PR diff ~2,800 files; the
    # perf twin of this review timed out twice at 15 on such a PR (#213).
    # The name-only fast path below is the real fix; the extra 5 minutes is
    # headroom for large source diffs.
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      id-token: write
      actions: read
    steps:
      # Dispatch supplies a number and nothing else, so the head SHA and base
      # ref come from the API. All three are repo metadata, never PR file
      # content, so they are safe to expand into later expressions. `jq -er`
      # fails the job on a typo'd number rather than running the review
      # against an empty head SHA.
      - name: Resolve PR coordinates
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          INPUT_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          meta=$(gh pr view "$INPUT_NUMBER" --json headRefOid,baseRefName,isDraft)
          {
            echo "number=$INPUT_NUMBER"
            echo "head_sha=$(printf '%s' "$meta" | jq -er .headRefOid)"
            echo "base_ref=$(printf '%s' "$meta" | jq -er .baseRefName)"
          } >> "$GITHUB_OUTPUT"
          # Draft is reported, not enforced: dispatching is already an
          # explicit "review this now", and a draft is a legitimate thing to
          # ask for early feedback on.
          if [ "$(printf '%s' "$meta" | jq -er .isDraft)" = "true" ]; then
            echo "::notice::PR #$INPUT_NUMBER is a draft — reviewing anyway (dispatch is explicit)."
          fi

      - name: Checkout base ref (trusted)
        uses: actions/checkout@v7
        with:
          # Never check out PR head. The base ref gives Claude the trusted
          # canonical source to compare against. PR head content is read via
          # `gh api .../contents/<path>?ref=<head_sha>` from inside the
          # prompt — data piped through Claude, never executed.
          ref: ${{ steps.pr.outputs.base_ref }}
          fetch-depth: 1
          persist-credentials: false

      - name: Run Claude a11y review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Skip the OIDC -> claude[bot] App-token exchange, which returned
          # `401 Invalid OIDC token` here; providing github_token bypasses it
          # entirely. Kept after the move to workflow_dispatch because it is
          # the known-working path — the cost is only that the review posts as
          # `github-actions[bot]` rather than `claude[bot]`.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # `allowed_bots` is deliberately absent. It existed to let
          # bot-authored PR *events* past the actor gate (#175: a baseline
          # push by `fiestaboard-ci-bot` fired `synchronize` and was rejected
          # in ~10s). There are no PR events any more — the actor is whoever
          # dispatched the run, which the gate already requires to have write
          # access. Re-add it only if a bot ever needs to dispatch this.
          show_full_output: "true"
          claude_args: >-
            --model claude-sonnet-4-6
            --max-turns 40
            --allowed-tools "Read,Glob,Grep,Bash(ls:*),Bash(cat:*),Bash(find:*),Bash(grep:*),Bash(rg:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr review:*),Bash(gh api:*)"
          prompt: |
            You are the FiestaUI accessibility reviewer. Review PR
            #${{ steps.pr.outputs.number }} — read its title and description
            with `gh pr view ${{ steps.pr.outputs.number }}`.

            (The title is fetched rather than interpolated: it is
            author-controlled text, and injecting it into this prompt would
            let a PR author write instructions to you.)

            FiestaUI is a React 19 component library on Base UI with Tailwind
            v4 tokens, published as `@fiestaboard/ui`. Every accessibility
            defect in `src/` is inherited by every downstream consumer.

            ## What NOT to review

            axe already runs on this PR. CI's `a11y-tests` job builds Storybook
            and runs `axe-playwright` over every story in both dark and light
            themes, and it is a required check. Do not re-report violations the
            default axe ruleset catches — that job will fail the PR on its own,
            and duplicating it wastes the maintainer's attention.

            Stay in your lane in the other direction too: correctness, naming,
            performance, and test coverage belong to the human reviewer, to CI,
            and to the perf auto-review.

            ## What to review

            The space axe structurally cannot reach:

            - **Keyboard and focus.** axe inspects a static DOM snapshot; it
              cannot press Tab. Look for: focus traps that are missing or
              broken in overlays, focus not restored to the trigger when a
              dialog/sheet/menu closes, missing Escape handling, roving
              tabindex or arrow-key navigation that the diff changes, controls
              reachable by mouse but not keyboard, and focus order that
              diverges from visual order.
            - **Motion.** `prefers-reduced-motion` is honored in CSS only in
              this repo (`src/styles/theme.css` and the season stylesheets).
              Any NEW JavaScript-driven animation — `requestAnimationFrame`,
              `setInterval`, WebGL via `ogl` — is invisible to those media
              queries and must consult the preference itself. Flag new motion
              that doesn't. (WCAG 2.3.3, and 2.2.2 for anything auto-playing
              beyond 5 seconds.)
            - **Semantic quality, not presence.** axe checks that an accessible
              name exists, not that it is useful. Flag names that are vague,
              duplicated across controls, or that don't match the visible
              label. Same for live-region politeness — `assertive` for routine
              updates is as wrong as `polite` for errors.
            - **Base UI prop forwarding.** These components wrap Base UI
              primitives. A wrapper that drops `id`, `ref`, or an `aria-*` prop
              before it reaches the primitive silently breaks the accessible
              description or the label association without breaking anything
              visible.
            - **ARIA correctness.** Attributes invalid for their role,
              redundant roles on native elements, and ARIA used where native
              semantics would work. The first rule of ARIA is not to use it.
            - **Uncovered states.** axe only sees the state a story renders. If
              the PR adds a component state (open, error, invalid, loading)
              with no story exercising it, say so — nothing is checking that
              markup.
            - **Touch targets.** Interactive targets below 24x24 CSS px
              (WCAG 2.5.8).

            ## Coverage reduction is a significant finding

            Treat any of the following as a headline finding, not a footnote —
            each one makes the project less accessible while making the checks
            quieter:

            - Adding a rule to the disabled list in
              `.storybook/test-runner.ts` (currently `page-has-heading-one`,
              `heading-order`, `color-contrast-enhanced`).
            - Relaxing the a11y config in `.storybook/preview.tsx`.
            - Adding an `eslint-disable jsx-a11y/*` comment.
            - Adding `aria-hidden` to a focusable element, `role="presentation"`
              to an interactive one, or `tabIndex={-1}` to silence a checker.
            - Adding entries to `vrt/skip.json` alongside a change to the same
              component.

            ## Known gaps worth remembering

            `.storybook/test-runner.ts` disables `heading-order` and
            `color-contrast-enhanced` (AAA) for CI, so nothing enforces heading
            hierarchy or AAA contrast on this PR. If the diff plausibly affects
            either, check it by hand rather than assuming the green check
            covered it.

            ## How to access PR content

            Start with `gh pr diff ${{ steps.pr.outputs.number }} --name-only`.
            If more than ~200 files change (typical of a `vrt/baselines/**`
            refresh — every re-baseline touches ~2,800 PNGs), do NOT fetch the
            full diff: it will not fit your time budget. Review only the
            non-baseline files, fetching each one's diff via
            `gh api repos/${{ github.repository }}/pulls/${{ steps.pr.outputs.number }}/files --paginate --jq '.[] | select(.filename | startswith("vrt/baselines/") | not)'`.
            Otherwise use `gh pr diff ${{ steps.pr.outputs.number }}` for the diff.
            Use `gh api repos/${{ github.repository }}/contents/<path>?ref=${{ steps.pr.outputs.head_sha }}`
            for full file contents. Never `git checkout` the PR head.

            ## Output

            Post ONE review comment via `gh pr review --comment`. Be specific
            with `file:line` references. For each finding, name the WCAG
            success criterion where one applies and say concretely who is
            affected — a keyboard-only user, a screen reader user, a low-vision
            user, a user who asked for reduced motion. Abstract rule citations
            don't get fixed; described experiences do.

            Calibrate. If the diff has no real accessibility impact, say so in
            one line and stop — a clean PR deserves a short review, not a
            manufactured finding.

            ## Hard rules

            - Read-only: never Edit, Write, or push.
            - One review comment per run.
            - Accessibility scope only.
            - Never suggest silencing a check as a remedy.
